# ============================================================================
# Forex AI System — development stack
# Usage:  make dev    (up)      make dev-down    (stop)
# SAFE MODE: TRADING_MODE only accepts "safe" (enforced by the backend too).
# ============================================================================

name: forex-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forex_ai}
      POSTGRES_USER: ${POSTGRES_USER:-forex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forex_dev_password}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      TRADING_MODE: ${TRADING_MODE:-safe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789abcdef}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_dev_password}@postgres:5432/${POSTGRES_DB:-forex_ai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source bind-mount for uvicorn --reload; dependency changes need `make dev` rebuild.
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker-ingest:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command:
      sh -c "alembic upgrade head && python -m app.worker_main"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      TRADING_MODE: ${TRADING_MODE:-safe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789abcdef}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_dev_password}@postgres:5432/${POSTGRES_DB:-forex_ai}
      REDIS_URL: redis://redis:6379/0
      WORKER_ROLE: ingest
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-synthetic}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,USDCHF,NZDUSD}
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-M15,H1,H4}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      OANDA_ENV: ${OANDA_ENV:-practice}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-10}
    volumes:
      # Source bind-mounts keep the worker hot-reloadable alongside the API.
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.worker_main' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker-agents:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command:
      sh -c "alembic upgrade head && python -m app.worker_main"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      TRADING_MODE: ${TRADING_MODE:-safe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789abcdef}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_dev_password}@postgres:5432/${POSTGRES_DB:-forex_ai}
      REDIS_URL: redis://redis:6379/0
      WORKER_ROLE: agents
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-M15,H1,H4}
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-ingest:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.worker_main' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Source bind-mount for hot reload; config/deps live in the image.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  pgdata:
  redisdata:
