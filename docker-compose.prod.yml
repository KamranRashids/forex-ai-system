# ============================================================================
# Forex AI System — production-style overlay (used with docker-compose.yml)
# Usage:  make prod-up / make prod-down   or:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences vs dev: optimized multi-stage images, no source bind mounts,
# no host DB/Redis ports, NGINX reverse proxy in front of api + web.
# TLS termination at nginx is finalized in Phase 10.
# ============================================================================

services:
  api:
    build:
      target: prod
    volumes: []
    environment:
      APP_ENV: prod
    ports: []

  web:
    build:
      target: prod
    volumes: []
    environment:
      NODE_ENV: production
    ports: []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
