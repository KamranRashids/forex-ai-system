name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format (check)
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy app

      # Strict coverage gate over the sync core (see pyproject [tool.coverage]
      # notes for why the gate is scoped to the unit suite).
      - name: Unit tests with coverage gate
        run: pytest tests/unit --cov=app --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forex_ai_test
          POSTGRES_USER: forex
          POSTGRES_PASSWORD: ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forex -d forex_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Proves the authenticated API works over a DB migrated via Alembic,
      # including token rotation/reuse detection and the RBAC matrix.
      - name: Integration tests (real PostgreSQL + Redis)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://forex:ci-password-only@localhost:5432/forex_ai_test
        run: pytest tests/integration
