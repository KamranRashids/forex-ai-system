name: Backend CI

# Least-privilege: this workflow only reads the repository and installs/audits
# Python dependencies. It never pushes, tags, or writes packages/issues.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install package with dev dependencies (hashed dev lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff format (check)
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy app

      # Strict coverage gate over the sync core (see pyproject [tool.coverage]
      # notes for why the gate is scoped to the unit suite).
      - name: Unit tests with coverage gate
        run: pytest tests/unit --cov=app --cov-report=term-missing

      # Python dependency audit. Policy (docs/phase10-ci-security.md §2):
      # STRICT over the production (runtime) closure that the deployed images
      # install — a new known vulnerability in a shipped package fails the
      # build. Dev-only findings (e.g. PYSEC-2026-1845 in pytest, audit F-06)
      # are documented, accepted exceptions and are excluded by construction:
      # this audits a runtime-only venv (no [dev] extras) built from the SAME
      # hashed runtime lock the images install (requirements.lock).
      - name: Python dependency audit (pip-audit, runtime closure)
        run: |
          python -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install --quiet --upgrade pip
          /tmp/pip-audit-venv/bin/pip install --quiet --require-hashes -r requirements.lock
          /tmp/pip-audit-venv/bin/pip install --quiet --no-deps -e .
          /tmp/pip-audit-venv/bin/pip install --quiet pip-audit
          /tmp/pip-audit-venv/bin/pip-audit --skip-editable

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forex_ai_test
          POSTGRES_USER: forex
          POSTGRES_PASSWORD: ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forex -d forex_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install package with dev dependencies (hashed dev lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      # Proves the authenticated API works over a DB migrated via Alembic,
      # including token rotation/reuse detection and the RBAC matrix.
      - name: Integration tests (real PostgreSQL + Redis)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://forex:ci-password-only@localhost:5432/forex_ai_test
        run: pytest tests/integration