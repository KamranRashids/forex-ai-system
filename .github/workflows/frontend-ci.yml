name: Frontend CI

# Least-privilege: this workflow only reads the repository and installs/audits
# Node dependencies. It never pushes, tags, or writes packages/issues.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test

      - name: ESLint
        run: npm run lint

      - name: TypeScript (no emit)
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build

      # Node dependency audit. Policy (docs/phase10-ci-security.md §3): the gate
      # is `npm audit --omit=dev` (production closure). Advisory IDs for
      # postcss/sharp (both transitive via next) are DOCUMENTED exceptions
      # (audit F-02/F-03 — build-time / not runtime-reachable) and are
      # allow-listed by .github/scripts/check-npm-audit.cjs. Any NEW advisory
      # (package or ID) fails the gate.
      - name: Node dependency audit (npm audit, production deps)
        run: npm audit --omit=dev --json > /tmp/npm-audit.json
        continue-on-error: true
      - name: Enforce npm audit policy
        run: node ../.github/scripts/check-npm-audit.cjs /tmp/npm-audit.json