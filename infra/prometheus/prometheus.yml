# ============================================================================
# Forex AI System — Prometheus scrape configuration (Phase 7)
# Scrapes the API's /metrics endpoint, which live-computes worker heartbeat
# and staleness gauges from Redis. No authentication is required for /metrics
# in the dev stack; the endpoint is excluded from OpenAPI schema.
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forex-ai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: forex-ai-api

  # Phase 12 O-1: per-process worker exporters (each worker owns its loop's
  # liveness/cycle/error metrics; ports pinned in docker-compose.yml).
  - job_name: forex-ai-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-ingest:9101
          - worker-agents:9102
          - worker-orchestrator:9103
          - worker-alerts:9104
          - worker-content:9105
        labels:
          service: forex-ai-workers
