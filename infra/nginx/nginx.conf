worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # ------------------------------------------------------------------
    # STAGING HTTPS termination (Phase 10 M1, staging phase).
    # Certificates are SELF-SIGNED and used ONLY for local verification:
    #   /etc/nginx/certs/fullchain.pem  ./infra/certs/fullchain.pem
    #   /etc/nginx/certs/privkey.pem    ./infra/certs/privkey.pem
    # HSTS is deliberately NOT enabled in this staging phase (it would pin
    # the self-signed certificate in browser caches). The real production
    # phase swaps in CA-issued certificates at the same mount paths and only
    # then enables Strict-Transport-Security (see docs/phase10-tls-audit.md).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 5m;

        add_header X-Frame-Options        DENY                            always;
        add_header X-Content-Type-Options nosniff                         always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Permissions-Policy     "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        # Content-Security-Policy derived from the ACTUAL resources used by the app:
        #  - Next.js app router: all scripts/styles/fonts/images are same-origin
        #    (_next/static). The app router streams its RSC hydration payload via
        #    inline <script>/<style> tags, which is why script-src/style-src include
        #    'unsafe-inline' (a genuine requirement of the current architecture;
        #    'unsafe-eval' is deliberately NOT allowed).
        #  - connect-src 'self' covers the same-origin REST API (/api/*), WebSockets
        #    (/api/v1/ws/stream, CSP3 treats wss of the same origin as 'self'),
        #    and /health. The production frontend is built with NEXT_PUBLIC_API_URL/
        #    NEXT_PUBLIC_WS_URL baked to the empty (same-origin) value; if a deployment
        #    bakes explicit endpoints instead, extend connect-src accordingly.
        #  - No external resources (fonts/images/scripts) are loaded anywhere.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'" always;

        client_max_body_size 1m;

        # REST API + WebSocket streams (/api/* proxied to FastAPI, prefix preserved
        # so the backend's /api/v1/* routes AND /api/v1/ws/stream upgrades resolve.
        # proxy_pass without a URI keeps the full path; Upgrade headers allow WS.)
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # WebSockets (ticket URLs use /api/v1/ws/stream -> handled by /api/ above;
        # a direct /ws/ path is preserved for upstream /ws/* routes)
        location /ws/ {
            proxy_pass http://api_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # External health probe passthrough
        location = /healthz {
            proxy_pass http://api_upstream/health/live;
        }

        # API-owned root probe/status paths (mirror the api server's system
        # router) so the frontend's health check and SAFE MODE status are
        # visible through the edge without exposing the api container.
        location = /health/live {
            proxy_pass http://api_upstream/health/live;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health/ready {
            proxy_pass http://api_upstream/health/ready;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /system/status {
            proxy_pass http://api_upstream/system/status;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js app
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # HTTP -> HTTPS redirect.
    # Only a 301 is served here (the frontend never uses plain http:
    # endpoints are baked same-origin). No content, no cookies, and NO
    # security headers are required on this block (browsers follow the
    # Location immediately). server_tokens off is global.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }
}